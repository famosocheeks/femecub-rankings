<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Consulta los rankings nacionales de speedcubing en México, organizados por la Federación Mexicana de Cubos A.C. (FEMECUB).">
  <meta name="keywords" content="FEMECUB, speedcubing, cubo de Rubik, rankings, México, competiciones">
  <meta name="author" content="FEMECUB">
  <title>FEMECUB - Ranking nacional</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            femecub: {
              red: '#B91C1C',
              green: '#036738',
              dark: '#1E293B',
            }
          },
          fontFamily: {
            nunito: ['Nunito', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.4.1/css/responsive.dataTables.min.css">

  <!-- Cubic icons & Fonts -->
  <link rel="stylesheet" href="https://cdn.cubing.net/v0/css/@cubing/icons/css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://use.typekit.net/bwe7xvt.css">

  <!-- Cube spinner -->
  <link rel="stylesheet" href="cube-spinner.css">
  <link rel="stylesheet" href="style.css">
</head>

<body class="font-nunito bg-gradient-to-br from-slate-100 via-blue-50 to-slate-200 min-h-screen">

  <!-- ─── LOADER ─────────────────────────────────────────── -->
  <div class="loader fixed inset-0 z-50 flex flex-col items-center justify-center bg-white gap-6" id="main-spinner">
    <div class="rubiks-loader">
      <div class="cube">
        <div class="face front piece row-top    col-left   yellow"></div>
        <div class="face front piece row-top    col-center green "></div>
        <div class="face front piece row-top    col-right  white "></div>
        <div class="face front piece row-center col-left   blue  "></div>
        <div class="face front piece row-center col-center green "></div>
        <div class="face front piece row-center col-right  blue  "></div>
        <div class="face front piece row-bottom col-left   green "></div>
        <div class="face front piece row-bottom col-center yellow"></div>
        <div class="face front piece row-bottom col-right  red   "></div>
        <div class="face down  piece row-top    col-center green "></div>
        <div class="face down  piece row-center col-center red   "></div>
        <div class="face down  piece row-bottom col-center white "></div>
        <div class="face right piece row-center col-left   yellow"></div>
        <div class="face right piece row-center col-center green "></div>
        <div class="face right piece row-center col-right  blue  "></div>
        <div class="face up    piece row-top    col-left   yellow"></div>
        <div class="face up    piece row-center col-left   blue  "></div>
        <div class="face up    piece row-bottom col-left   green "></div>
        <div class="face left  piece row-bottom col-left   green "></div>
        <div class="face left  piece row-bottom col-center yellow"></div>
        <div class="face left  piece row-bottom col-right  red   "></div>
      </div>
    </div>
    <div class="flex flex-col items-center gap-1 text-center">
      <span class="font-extrabold text-2xl tracking-widest" style="font-family:'apotek-extended',sans-serif;">
        <span class="text-femecub-green">RANKING</span> <span class="text-femecub-red">NACIONAL</span>
      </span>
      <span class="text-slate-500 text-sm">Espera mientras cargamos la información…</span>
    </div>
  </div>

  <!-- ─── HERO ──────────────────────────────────────────── -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-2">
    <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-3">
      <div>
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight"
          style="font-family:'apotek-extended',sans-serif;">
          <span class="text-femecub-green">RANKING</span> <span class="text-femecub-red">NACIONAL</span>
        </h1>
        <p class="mt-1 text-slate-500 text-sm">Eventos organizados por la Federación Mexicana de Cubos A.C.</p>
      </div>
      <a href="all.html"
        class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-femecub-green text-white text-sm font-bold shadow hover:bg-green-800 transition-colors self-start sm:self-auto">
        Ver todos los resultados →
      </a>
    </div>
  </div>

  <!-- ─── FILTERS CARD ──────────────────────────────────── -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 flex flex-col gap-4">

      <!-- Row 1: Modalidad label + buttons -->
      <div>
        <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Modalidad</p>
        <div id="categories-buttons" class="flex flex-wrap gap-2"></div>
      </div>

      <!-- Row 2: Snake sub-filter (hidden by default) -->
      <div id="snake-filter-container" class="hidden">
        <p class="text-xs font-bold text-amber-700 uppercase tracking-wider mb-2">🐍 Figura Snake</p>
        <div id="snake-buttons" class="flex flex-wrap gap-2"></div>
      </div>

      <!-- Row 3: Tipo + Categoria + Search in one row -->
      <div class="flex flex-wrap gap-3 items-start">
        <!-- Tipo de ranking -->
        <div class="flex flex-col gap-1">
          <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Tipo</p>
          <div id="type-buttons" class="flex gap-2">
            <button class="type-btn type-selected" id="bestTime">Mejor tiempo</button>
            <button class="type-btn" id="bestAverage">Mejor promedio</button>
          </div>
        </div>
        <!-- Categorias (age/gender) -->
        <div class="flex flex-col gap-1 flex-1 min-w-[180px]">
          <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Categoría</p>
          <div id="category-buttons" class="flex flex-wrap gap-2"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- ─── TABLE CARD ────────────────────────────────────── -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-5 pb-12">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
      <table id="tablaRankings" class="display w-full"></table>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/responsive/2.4.1/js/dataTables.responsive.min.js"></script>
  <script src="rankings.js"></script>
</body>

</html>
